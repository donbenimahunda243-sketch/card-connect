<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner - Card Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- LIBRAIRIE QR SCANNER -->

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f8fafc;
overflow-x:hidden;
}

/* DECORS */

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(37,99,235,0.08);
border-radius:50%;
filter:blur(120px);
top:-150px;
right:-150px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:400px;
height:400px;
background:rgba(30,58,138,0.08);
border-radius:50%;
filter:blur(120px);
bottom:-150px;
left:-150px;
z-index:-1;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:white;
box-shadow:0 2px 20px rgba(0,0,0,0.05);
}

.logo{
font-size:28px;
font-weight:700;
color:#2563eb;
}

.header-right{
display:flex;
align-items:center;
gap:15px;
}

.secure{
background:#dcfce7;
color:#16a34a;
padding:10px 18px;
border-radius:14px;
font-weight:600;
}

.logout-btn{
background:#fee2e2;
color:#dc2626;
border:none;
padding:10px 18px;
border-radius:14px;
font-weight:600;
cursor:pointer;
transition:0.3s;
font-family:'Poppins',sans-serif;
}

.logout-btn:hover{
transform:translateY(-2px);
}

/* CONTAINER */

.container{
padding:50px 20px;
max-width:1200px;
margin:auto;
}

/* TITLE */

.title{
text-align:center;
margin-bottom:50px;
}

.title h1{
font-size:42px;
margin-bottom:15px;
}

.title p{
color:#64748b;
}

/* SCANNER BOX */

.scanner-box{
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.05);
max-width:700px;
margin:auto;
animation:fadeUp 0.8s ease;
}

#reader{
border-radius:20px;
overflow:hidden;
}

.scan-info{
margin-top:30px;
padding:25px;
border-radius:20px;
background:#eff6ff;
display:none;
}

.scan-info h3{
margin-bottom:10px;
color:#2563eb;
}

.scan-info p{
margin-bottom:8px;
}

/* BUTTON */

.btn{
margin-top:25px;
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#2563eb;
color:white;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:0.3s;
font-family:'Poppins',sans-serif;
}

.btn:hover{
background:#1e3a8a;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* RESPONSIVE */

@media(max-width:768px){

header{
padding:20px;
flex-direction:column;
gap:15px;
}

.title h1{
font-size:32px;
}

.scanner-box{
padding:20px;
}

.header-right{
flex-direction:column;
width:100%;
}

.logout-btn{
width:100%;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
CARD CONNECT
</div>

<div class="header-right">

<div class="secure">
<i class="fa-solid fa-shield-halved"></i>
 Scanner Sécurisé
</div>

<button class="logout-btn" onclick="logoutScanner()">
<i class="fa-solid fa-right-from-bracket"></i>
 Déconnexion
</button>

</div>

</header>

<div class="container">

<div class="title">

<h1>Scanner une carte</h1>

<p>
Scannez un QR Code Card Connect pour accéder au profil sécurisé.
</p>

</div>

<div class="scanner-box">

<!-- SCANNER -->

<div id="reader"></div>

<!-- RESULT -->

<div class="scan-info" id="scanInfo">

<h3>Carte détectée</h3>

<p id="scanResult"></p>

<button class="btn" id="openProfileBtn">
Ouvrir le profil
</button>

<button class="btn" onclick="restartScanner()" style="background:#16a34a;">
Scanner une autre carte
</button>

</div>

</div>

</div>

<script>

/* VERIFICATION SESSION */

const isAuthenticated =
localStorage.getItem("scannerAuthenticated");

if(isAuthenticated !== "true"){

window.location.href = "scanner-login.html";

}

/* VARIABLES */

let scannedLink = '';

/* SCAN SUCCESS */

function onScanSuccess(decodedText, decodedResult){

scannedLink = decodedText;

/* STOP SCAN */

html5QrcodeScanner.clear();

/* SHOW RESULT */

document.getElementById('scanInfo').style.display = 'block';

document.getElementById('scanResult').innerHTML =
`
<b>Lien détecté :</b><br>
${decodedText}
`;

}

/* START CAMERA */

const html5QrcodeScanner = new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:250
}
);

html5QrcodeScanner.render(onScanSuccess);

/* OPEN PROFILE */

document.getElementById('openProfileBtn').addEventListener('click',()=>{

if(scannedLink){

window.location.href = scannedLink;

}

});

/* RESTART SCANNER */

function restartScanner(){

document.getElementById('scanInfo').style.display = 'none';

html5QrcodeScanner.render(onScanSuccess);

}

/* LOGOUT */

function logoutScanner(){

localStorage.removeItem("scannerAuthenticated");

localStorage.removeItem("scannerRole");

window.location.href = "scanner-login.html";

}

</script>

</body>
</html>
